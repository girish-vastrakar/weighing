<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f2a33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weighing">
<title>Proximate weighing</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+Gujarati:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f2a33; --muted: #5a6872; --base: #eef2f4; --surface: #ffffff; --line: #d3dbe0;
    --ok: #2e7d4f; --err: #b3261e; --warn: #9a5b00;
    /* Test colours follow the header colours in the lab sheet */
    --MC: #a8426b;  --MC-bg: #f5e3eb;
    --VM: #3c7a2a;  --VM-bg: #e1f0d8;
    --ASH: #574a9c; --ASH-bg: #e9e6f5;
    --TM: #b0432d;  --TM-bg: #f8dfd8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--base); color: var(--ink);
    font-family: 'Atkinson Hyperlegible', 'Noto Sans Gujarati', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 18px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #2b6cb0; outline-offset: 2px; }
  .wrap { max-width: 540px; margin: 0 auto; padding: 16px 16px 130px; }

  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  header.top h1 { font-size: 1.3rem; margin: 0; }
  .hbtns { display: flex; gap: 8px; }
  .pill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: .9rem; color: var(--muted); }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin-bottom: 12px; }
  .tabs button { border: 0; background: none; padding: 12px 6px; border-radius: 10px; font-weight: 700; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; }
  .count { display: inline-block; min-width: 1.5em; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--TM); color: #fff; font-size: .85rem; }

  .field { width: 100%; padding: 14px 16px; font: inherit; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 12px; }
  .list { display: flex; flex-direction: column; gap: 10px; }

  .sample.last, .testbtn.last { outline: 3px solid #2b6cb0; outline-offset: 2px; }
  .sample { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .sample .code { font-size: 1.5rem; font-weight: 700; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: .85rem; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
  .chip.prog { background: var(--c-bg); color: var(--c); border-color: var(--c); }
  .chip.done { background: var(--c); color: #fff; border-color: var(--c); }

  .back { background: none; border: 0; padding: 8px 0; font-weight: 700; color: var(--muted); font-size: 1rem; }
  .title { font-size: 1.9rem; margin: 4px 0 2px; color: var(--c, var(--ink)); }
  .sub { color: var(--muted); margin: 0 0 16px; }

  .testbtn { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-left: 10px solid var(--c); border-radius: 14px; padding: 18px 16px; }
  .testbtn .name { font-weight: 700; font-size: 1.15rem; }
  .testbtn .state { color: var(--muted); font-size: .95rem; margin-top: 2px; }
  .testbtn.done .state { color: var(--ok); font-weight: 700; }

  .tmbox { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--line); }
  .tmbox .q { font-weight: 700; margin: 0 0 10px; }
  .toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .toggle button { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
  .toggle button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0 6px; }
  .steps span { height: 8px; border-radius: 4px; background: var(--line); }
  .steps span.on { background: var(--c); }
  .stepno { font-weight: 700; color: var(--c); margin: 0 0 14px; }
  .instr { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; }

  /* The balance-style readout: the one bold element */
  .readout { display: flex; align-items: baseline; gap: 10px; background: #15212a; border-radius: 16px; padding: 18px 20px; border: 3px solid var(--c); }
  .readout input { flex: 1; min-width: 0; background: none; border: 0; color: #e6f6ec; font: 700 2.6rem/1.1 'Atkinson Hyperlegible', 'Noto Sans Gujarati', system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .02em; outline: none; }
  .readout input::placeholder { color: #4b5d68; }
  .readout .unit { color: #9fb3bf; font-size: 1.4rem; }
  .live { min-height: 1.6em; margin: 12px 2px 0; font-size: 1.1rem; }
  .live b { font-variant-numeric: tabular-nums; }
  .live .warn { color: var(--warn); font-weight: 700; }
  .ind { display: inline-block; padding: 8px 14px; border-radius: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ind.low { background: #fff1b8; color: #7a5300; border: 2px solid #e0b300; }
  .ind.ok  { background: #dff3e6; color: var(--ok); border: 2px solid var(--ok); }

  .prev { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .prev .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .prev .row:first-child { border-top: 0; }
  .prev b { font-variant-numeric: tabular-nums; }
  .link { background: none; border: 0; color: var(--c, var(--ink)); font-weight: 700; text-decoration: underline; padding: 8px; }
  .center { display: block; margin: 16px auto 0; }

  .result { display: flex; justify-content: space-between; align-items: baseline; background: var(--c-bg); border: 2px solid var(--c); border-radius: 14px; padding: 16px 18px; margin-top: 10px; }
  .result b { font-size: 2rem; color: var(--c); font-variant-numeric: tabular-nums; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bar .inner, .btnrow { max-width: 540px; margin: 0 auto; display: flex; gap: 10px; }
  .primary { flex: 1; border: 0; border-radius: 14px; padding: 18px; font-weight: 700; font-size: 1.15rem; background: var(--c, var(--ink)); color: #fff; }
  .primary:disabled { opacity: .5; }
  .secondary { flex: 1; border: 1px solid var(--line); border-radius: 14px; padding: 18px; font-weight: 700; font-size: 1.05rem; background: var(--surface); }

  .modal { position: fixed; inset: 0; background: rgba(20, 30, 38, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--surface); width: 100%; max-width: 540px; border-radius: 20px 20px 0 0; padding: 24px 20px calc(20px + env(safe-area-inset-bottom)); }
  .big { font-size: 2.8rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 6px 0 14px; }
  .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 2rem; display: grid; place-items: center; margin-bottom: 12px; }
  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: up .18s ease-out; }
    @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 110px; background: var(--err); color: #fff; padding: 12px 18px; border-radius: 12px; width: max-content; max-width: 90%; z-index: 20; font-weight: 700; }
  .toast.ok { background: var(--ok); }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .lang { font-weight: 700; color: var(--ink); }
  #sync { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 30; border: 0; border-radius: 999px;
          padding: 8px 16px; font: 700 .9rem/1.2 inherit; background: #fff1b8; color: #7a5300; box-shadow: 0 2px 8px rgba(0,0,0,.15);
          max-width: 92%; }
  #sync.ok { background: #dff3e6; color: var(--ok); }
  #sync.bad { background: #fde2e1; color: var(--err); }
  .install { background: var(--ok); color: #fff; border-color: var(--ok); font-weight: 700; }
  html[lang="gu"] body { line-height: 1.5; }
</style>
</head>
<body>
<button id="sync" type="button" hidden></button>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>

// Tests, in the order shown. targetSample = sample weight (g) at which W2 turns green.

};
const ORDER = Object.keys(TESTS);
/* ================================================================================== */

const store = {
  get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
// Remembers where the worker was on the list, per tab (also kept after the app is closed)
const POS = (() => { try { return JSON.parse(store.get('pos') || '{}'); } catch (e) { return {}; } })();
const S = {
  data: null, tests: null, order: [], worker: store.get('worker'), lang: store.get('lang') || 'en',
  view: 'home', tab: 'samples', query: '', showDone: false,

/* ---------- GitHub storage (one JSON file in a private repository) ---------- */
let KEY = store.get('ghkey');
const API = `https://api.github.com/repos/${GH.owner}/${GH.repo}`;
function ghErr(msg, props) { const e = new Error(msg); Object.assign(e, props); return e; }
async function gh(method, url, body, accept) {
  if (!KEY) throw ghErr('No storage key on this phone.', { code: 'NOKEY' });
  let res;
  try {
    res = await fetch(url, {
      method, cache: 'no-store', credentials: 'omit',
      headers: { 'Authorization': 'Bearer ' + KEY, 'Accept': accept || 'application/vnd.github+json',
                 ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (e) { throw ghErr('offline', { code: 'OFFLINE', retry: true, detail: String(e.message || e) }); }
  if (res.ok) return res;
  let msg = ''; try { msg = (await res.json()).message || ''; } catch (e) {}
  if (res.status === 401) throw ghErr(T().keyBad, { code: 'KEY', detail: 'GitHub: ' + msg });
  if (res.status === 409 || res.status === 422 && /sha/i.test(msg)) throw ghErr('conflict', { code: 'CONFLICT', retry: true });
  if (res.status === 403 && /rate limit/i.test(msg)) throw ghErr('GitHub is busy, retrying.', { retry: true });
  if (res.status === 403) throw ghErr(T().keyBad, { code: 'KEY', detail: 'GitHub: ' + msg });
  if (res.status === 404) throw ghErr('not found', { code: 'NOTFOUND', detail: 'GitHub: ' + msg });
  throw ghErr('GitHub error ' + res.status + (msg ? ': ' + msg : ''), { retry: res.status >= 500 });
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
const emptyFile = () => ({ app: 'proximate-weighing', version: 1, codes: [], samples: {} });
// Read the data file. Returns { file, sha }; file is null if it doesn't exist yet.
async function ghRead() {
  const url = `${API}/contents/${GH.path}?ref=${GH.branch}`;
  let meta;
  try { meta = await (await gh('GET', url)).json(); }
  catch (e) {
    if (e.code !== 'NOTFOUND') throw e;
    // Is the file missing, or is the repository unreachable with this key?
    try { await gh('GET', API); } catch (e2) {
      if (e2.code === 'NOTFOUND') throw ghErr(T().keyBad, { code: 'KEY', detail: `Repository ${GH.owner}/${GH.repo} not found for this key.` });
      throw e2;
    }
    return { file: null, sha: null };
  }
  const text = meta.content ? b64decode(meta.content)
             : await (await gh('GET', url, null, 'application/vnd.github.raw+json')).text();   // files over 1 MB
  return { file: JSON.parse(text), sha: meta.sha };
}
async function ghWrite(file, sha, message) {
  const body = { message, branch: GH.branch, content: b64encode(JSON.stringify(file, null, 1)) };
  if (sha) body.sha = sha;
  return (await (await gh('PUT', `${API}/contents/${GH.path}`, body)).json()).content.sha;
}

/* ---------- the data file <-> what the screens use ---------- */
const stamp = d => { const x = new Date(d || Date.now()), p = n => String(n).padStart(2, '0');
  return `${p(x.getDate())}-${x.toLocaleString('en', { month: 'short' })}-${x.getFullYear()} ${p(x.getHours())}:${p(x.getMinutes())}`; };
function fileSample(f, code) {
  if (!f.samples[code]) {
    f.samples[code] = { tm: false, w: Object.fromEntries(ORDER.map(k => [k, [null, null, null]])), pct: {}, last: '' };
    if (!f.codes.includes(code)) f.codes.push(code);
  }
  const s = f.samples[code]; s.pct = s.pct || {};
  ORDER.forEach(k => { if (!s.w[k]) s.w[k] = [null, null, null]; });
  return s;
}
// Apply one change (from this phone's waiting list) to the data file
function fileApply(f, j) {
  if (j.action === 'saveWeight') {
    const s = fileSample(f, j.code);
    s.w[j.key][j.step - 1] = j.value; delete s.pct[j.key];
    s.last = `${j.worker || 'Unknown'} | ${TESTS[j.key].label} W${j.step} | ${stamp(j.at)}`;
  } else if (j.action === 'setTmRequired') {
    fileSample(f, j.code).tm = !!j.value;
  } else if (j.action === 'addCodes') {
    j.codes.forEach(c => fileSample(f, c));
  } else if (j.action === 'removeCode') {
    const s = f.samples[j.code];
    if (s && !ORDER.some(k => s.w[k].some(v => v !== null) || s.pct[k] != null)) {
      delete f.samples[j.code]; f.codes = f.codes.filter(c => c !== j.code);
    }
  } else if (j.action === 'importRows') {
    j.rows.forEach(r => {
      const s = fileSample(f, r.code);
      ORDER.forEach(k => {
        (r.w[k] || []).forEach((v, i) => { if (v !== null) s.w[k][i] = v; });
        if (r.pct[k] != null && !s.w[k].every(v => v !== null)) s.pct[k] = r.pct[k];
      });
      if (r.tm) s.tm = true;
      if (r.last && !s.last) s.last = r.last;
    });
  }
}
function toData(f) {
  const samples = f.codes.filter(c => f.samples[c]).map(code => {
    const fs = f.samples[code];
    const s = { code, tmRequired: !!fs.tm, last: fs.last || '', tests: {} };
    ORDER.forEach(k => { s.tests[k] = { w: fs.w[k].slice(), pct: isNum(fs.pct[k]) ? fs.pct[k] : null, done: 0, required: true }; });
    recompute(s);
    return s;
  });
  return { samples, tests: TESTS, order: ORDER };
}
// What the worker sees = last copy from GitHub + this phone's unsent changes
function rebuild() {
  const f = JSON.parse(JSON.stringify(S.file || emptyFile()));
  Q.forEach(j => fileApply(f, j));
  S.data = toData(f);
}
/* ---------- save on the phone first, send to the sheet in the background ---------- */
const readJSON = (k, d) => { try { return JSON.parse(store.get(k)) || d; } catch (e) { return d; } };
let Q = readJSON('queue', []);          // weights waiting to reach the sheet (kept if the app is closed)
let syncing = false, syncTimer = null, syncFails = 0, lastSyncOk = 0;
function saveQ() { store.set('queue', JSON.stringify(Q)); }
function cacheFile() { if (S.file) store.set('file', JSON.stringify(S.file)); }

const r2 = x => Math.round(x * 100) / 100;
// Same rules as the sheet formulas, so the worker sees the result straight away
function recompute(s) {
  S.order.forEach(k => {
    const t = s.tests[k], w = t.w;
    let done = 0; while (done < 3 && isNum(w[done])) done++;
    if (done === 3) {
      if (k === 'ASH') t.pct = r2((w[2] - w[0]) / (w[1] - w[0]) * 100);
      else if (k === 'VM') {
        const mc = s.tests.MC && s.tests.MC.pct;
        t.pct = isNum(mc) ? r2((w[1] - w[2]) / (w[1] - w[0]) * 100 - mc) : null;
      } else t.pct = r2((w[1] - w[2]) / (w[1] - w[0]) * 100);
    }
    t.done = isNum(t.pct) ? 3 : done;
    t.required = !S.tests[k].optional || s.tmRequired;
  });
  const req = S.order.filter(k => s.tests[k].required);
  s.status = req.every(k => isNum(s.tests[k].pct) || (k === 'VM' && s.tests[k].done === 3)) ? 'Complete'
           : S.order.some(k => s.tests[k].done > 0) ? 'In progress' : 'Pending';
}
function enqueue(job) {
  job.id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
  job.at = Date.now();
  // a newer value for the same cell replaces an unsent older one
  if (job.action === 'saveWeight' || job.action === 'setTmRequired')
    Q = Q.filter(j => !(j.action === job.action && j.code === job.code && j.key === job.key && j.step === job.step));
  Q.push(job); saveQ();

function commitMessage(batch) {
  const first = batch[0];
  const what = first.action === 'saveWeight' ? `${first.code} ${TESTS[first.key].label} W${first.step}`
             : first.action === 'addCodes' ? `add ${first.codes.length} code(s)`
             : first.action === 'importRows' ? `import ${first.rows.length} row(s)` : `${first.action} ${first.code || ''}`;
  return `${what}${batch.length > 1 ? ` (+${batch.length - 1} more)` : ''} by ${first.worker || S.worker || 'app'}`;
}
async function sync() {
  clearTimeout(syncTimer);
  if (syncing || !Q.length || !KEY) { showSync(); return; }
  syncing = true; S.syncErr = null; showSync();
  const batch = Q.slice();
  try {
    for (let attempt = 0; ; attempt++) {
      const { file, sha } = await ghRead();
      const f = file || emptyFile();
      batch.forEach(j => fileApply(f, j));
      try { await ghWrite(f, sha, commitMessage(batch)); S.file = f; break; }
      catch (e) { if (e.code !== 'CONFLICT' || attempt >= 4) throw e; }   // another phone saved first: read again
    }
    const sent = new Set(batch.map(j => j.id));
    Q = Q.filter(j => !sent.has(j.id)); saveQ(); cacheFile();
    syncFails = 0; lastSyncOk = Date.now();
    rebuild();

  } catch (err) {
    syncFails++;
    S.syncErr = err;
    if (err.retry || err.code === 'NOTFOUND') syncTimer = setTimeout(sync, Math.min(60000, 4000 * Math.pow(2, syncFails - 1)));

  if (n) {

    el.className = syncFails ? 'bad' : '';
    el.textContent = !KEY ? '⚠ ' + t.notSetUp
      : S.syncErr && S.syncErr.code === 'KEY' ? '⚠ ' + t.keyBad
      : syncFails ? t.retrying(n) : syncing ? t.sending(n) : t.pending(n);
    if (!KEY || (S.syncErr && S.syncErr.code === 'KEY')) el.className = 'bad';
  } else if (Date.now() - lastSyncOk < 2500) {

function liveText() {
  const v = parseW(S.draft);
  if (v === null) return '';
  const t = T(), k = S.test, cfg = S.tests[k], w = sample(S.code).tests[k].w;
  const warn = m => `<span class="warn">${esc(m)}</span>`;
  if (S.step === 1 && isNum(w[1]))
    return v >= w[1] ? warn(t.notLessW2(fmt(w[1]))) : esc(t.sampleW(fmt(w[1] - v)));
  if (S.step === 2 && isNum(w[0])) {
    const d = v - w[0];
    if (d <= 0) return warn(t.notMoreW1(ves(k), fmt(w[0])));
    if (!cfg.targetSample) return esc(t.sampleW(fmt(d)));
    return d < cfg.targetSample
      ? `<span class="ind low">${esc(t.sampleW(fmt(d)))}</span>`
      : `<span class="ind ok">${esc(t.sampleW(fmt(d)))} ✓</span>`;
  }
  if (S.step === 3 && isNum(w[0]) && isNum(w[1])) {
    if (v > w[1]) return warn(t.heavier(fmt(w[1])));
    if (v < w[0]) return warn(t.lighter(ves(k), fmt(w[0])));
    const sw = w[1] - w[0];
    if (k === 'ASH') return esc(t.ashLeft(fmt(v - w[0]), ((v - w[0]) / sw * 100).toFixed(2)));
    const lost = t.lost(fmt(w[1] - v));
    return esc(k === 'VM' ? lost : `${lost} (${((w[1] - v) / sw * 100).toFixed(2)} %)`);
  }
  return '';
}

function saveKey() {
  const v = (document.getElementById('key').value || '').trim();
  if (!v) { toast('Paste the key first.'); return; }
  KEY = v; store.set('ghkey', KEY); S.syncErr = null; syncFails = 0;
  toast('Key saved. Checking…', true);
  load(false).then(() => { if (S.view === 'setup') render(); if (!S.syncErr) toast('Connected to GitHub.', true); });
}
function nextCode() {
  const nums = (S.data ? S.data.samples : []).map(s => (s.code.match(/^([A-Za-z]*)(\d+)$/) || [])).filter(m => m[2]);
  if (!nums.length) return 'T01';
  const last = nums[nums.length - 1], n = Math.max(...nums.filter(m => m[1] === last[1]).map(m => +m[2])) + 1;
  return last[1] + String(n).padStart(last[2].length, '0');
}
function parseCodes(txt) {
  const out = [];
  txt.toUpperCase().split(/[,\s]+/).filter(Boolean).forEach(part => {
    const m = part.match(/^([A-Z]*)(\d+)-([A-Z]*)(\d+)$/);
    if (m) {
      const a = +m[2], b = +m[4], w = m[2].length;
      if (b - a > 500 || b < a) return;
      for (let i = a; i <= b; i++) out.push(m[1] + String(i).padStart(w, '0'));
    } else out.push(part);
  });
  return [...new Set(out)];
}
function addCodes() {
  const inp = document.getElementById('newcodes');
  const codes = parseCodes(inp.value || inp.placeholder);
  const have = new Set((S.data ? S.data.samples : []).map(s => s.code));
  const fresh = codes.filter(c => !have.has(c));
  if (!fresh.length) { toast(codes.length ? 'Those codes already exist.' : 'Type a code first.'); return; }
  enqueue({ action: 'addCodes', codes: fresh, worker: S.worker });
  toast(`Added ${fresh.length} code${fresh.length > 1 ? 's' : ''}: ${fresh[0]}${fresh.length > 1 ? ' … ' + fresh[fresh.length - 1] : ''}`, true);
  render();
}
function exportCSV() {
  const q = v => { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const head1 = ['', ...ORDER.flatMap(k => [TESTS[k].label, '', '', '']), 'Tracking', '', ''];
  const head2 = ['Code', ...ORDER.flatMap(() => ['W1', 'W2', 'W3', 'Percentage']), 'TM Required', 'Status', 'Last updated'];
  const rows = S.data.samples.map(s => [s.code,
    ...ORDER.flatMap(k => [...s.tests[k].w.map(v => isNum(v) ? v : ''), isNum(s.tests[k].pct) ? s.tests[k].pct : '']),
    s.tmRequired ? 'Y' : '', s.status, s.last || '']);
  const csv = '\ufeff' + [head1, head2, ...rows].map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `proximate-results-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function parseCSV(text) {
  const rows = []; let row = [], cell = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; } else cell += c; }
    else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
document.addEventListener('change', e => {
  if (e.target.id !== 'csvfile' || !e.target.files[0]) return;
  e.target.files[0].text().then(text => {
    const num = v => { v = String(v || '').trim().replace(',', '.'); return v !== '' && !isNaN(+v) ? +v : null; };
    const rows = parseCSV(text.replace(/^\ufeff/, ''))
      .filter(r => /^[A-Za-z]*\d+$/.test(String(r[0] || '').trim()))          // data rows only (skip headers)
      .map(r => {
        const out = { code: r[0].trim().toUpperCase(), w: {}, pct: {}, tm: /^(y|yes|true)$/i.test(String(r[17] || '').trim()), last: (r[19] || '').trim() };
        ORDER.forEach((k, i) => { const c = 1 + i * 4; out.w[k] = [num(r[c]), num(r[c + 1]), num(r[c + 2])]; out.pct[k] = num(r[c + 3]); });
        return out;
      });
    if (!rows.length) { toast('No sample rows found in that file.'); return; }
    enqueue({ action: 'importRows', rows, worker: S.worker });
    toast(`Imported ${rows.length} samples. Saving online…`, true);
    render();
  });
  e.target.value = '';
});

function savePos() {

function render() {

  const v = { home: renderHome, sample: renderSample, step: renderStep, review: renderReview, name: renderName, setup: renderSetup }[S.view];

/* ---------- actions ---------- */
let loading = false;
async function load(showToast) {
  if (loading) return;
  if (!KEY) { if (!S.data) renderNotReady(); return; }
  loading = true;
  try {
    const { file } = await ghRead();
    S.file = file || emptyFile(); cacheFile();
    rebuild();
    if (!S.modal && S.view !== 'setup' && !(S.view === 'step' && document.activeElement && document.activeElement.id === 'w')) render();
    if (showToast) toast(T().updated, true);
    sync();
  } catch (err) {
    S.syncErr = err; showSync();
    if (S.data) { if (showToast) toast(err.code === 'KEY' ? T().keyBad : T().cachedList); return; }
    renderNotReady(err);
  } finally { loading = false; }
}
function renderNotReady(err) {
  if (S.view === 'setup' || S.view === 'name') return;
  const t = T();
  const msg = !KEY ? t.notSetUp : err && err.code === 'KEY' ? t.keyBad : t.loadFail + ' ' + (err && err.code === 'OFFLINE' ? t.offline : (err && err.message || ''));

    <button class="secondary" data-act="refresh">${esc(t.tryAgain)}</button></div></div>`;
}

function openTest(k) {

}

// Same checks as the sheet script, shown in the worker's language
function checkWeight(v) {
  const t = T(), k = S.test, w = sample(S.code).tests[k].w.slice();
  w[S.step - 1] = v;
  if (isNum(w[0]) && isNum(w[1]) && w[1] <= w[0]) return S.step === 1 ? t.errW1 : t.errW2(ves(k));
  if (isNum(w[2]) && isNum(w[1]) && w[2] > w[1]) return t.errW3hi;
  if (isNum(w[2]) && isNum(w[0]) && w[2] < w[0]) return t.errW3lo(ves(k));
  return '';
}

  const st = sample(S.code).tests[S.test];
  const m = { type: 'saved', next: 'sample', step: S.step, pct: st.pct };

  else if (S.step === 1) { m.kind = 's1'; m.next = 'step2'; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || S.busy) return;
  switch (el.dataset.act) {
    case 'lang': {
      const nm = document.getElementById('nm');
      const typed = nm ? [nm.value] : null;   // keep a half-typed name
      S.lang = S.lang === 'en' ? 'gu' : 'en'; store.set('lang', S.lang);
      render(); showSync();
      if (typed && document.getElementById('nm')) {
        document.getElementById('nm').value = typed[0];
      }
      break;
    }
    case 'install': {
      const ev = installEvt; installEvt = null; render();
      if (ev) { ev.prompt(); ev.userChoice.then(c => { if (c.outcome === 'accepted') toast(T().installed, true); }); }
      break;
    }
    case 'tab': savePos(); S.tab = el.dataset.tab; S.restoreOnce = true; render(); break;
    case 'toggle-done': S.showDone = !S.showDone; render(); break;
    case 'open-sample':
      rememberCard(`.sample[data-code="${CSS.escape(el.dataset.code)}"]`);
      S.code = el.dataset.code; S.view = 'sample'; render(); break;
    case 'open-final':
      rememberCard(`.testbtn[data-code="${CSS.escape(el.dataset.code)}"][data-test="${CSS.escape(el.dataset.test)}"]`);
      S.code = el.dataset.code; openTest(el.dataset.test); break;
    case 'open-test': openTest(el.dataset.test); break;
    case 'home': S.view = 'home'; render(); S.restoreOnce = true; load(false); break;
    case 'back-sample': S.view = 'sample'; S.modal = null; render(); break;
    case 'tm': setTm(el.dataset.val === '1'); break;
    case 'edit': {
      S.step = Number(el.dataset.step); S.editing = true; S.view = 'step';
      const w = sample(S.code).tests[S.test].w[S.step - 1];
      S.draft = isNum(w) ? String(w) : ''; render(); break;
    }
    case 'save': askConfirm(); break;
    case 'cancel': S.modal = null; render(); break;
    case 'confirm': doSave(); break;
    case 'after': {
      const next = S.modal.next; S.modal = null;
      if (next === 'step2') { S.step = 2; S.draft = ''; S.editing = false; S.view = 'step'; }
      else S.view = 'sample';
      render(); break;
    }
    case 'refresh': load(true); break;
    case 'setup': S.view = 'setup'; render(); break;
    case 'setup-done': S.view = S.worker ? 'home' : 'name'; if (S.data) render(); else renderNotReady(); load(false); break;
    case 'save-key': saveKey(); break;
    case 'forget-key': if (confirmTap(el)) { KEY = ''; store.set('ghkey', ''); S.syncErr = null; render(); showSync(); } break;
    case 'add-codes': addCodes(); break;
    case 'remove-code': if (confirmTap(el)) { enqueue({ action: 'removeCode', code: el.dataset.code, worker: S.worker }); render(); } break;
    case 'export': exportCSV(); break;
    case 'import': document.getElementById('csvfile').click(); break;
    case 'name': S.view = 'name'; render(); break;
    case 'save-name': saveName(); break;
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'w') {
    S.draft = e.target.value;
    document.getElementById('live').innerHTML = liveText();
  } else if (e.target.dataset.input === 'query') {
    S.query = e.target.value;
    document.getElementById('list').innerHTML = listHTML();
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || S.busy) return;
  if (e.target.id === 'w') askConfirm();
  else if (e.target.id === 'nm') saveName();
  else if (e.target.id === 'newcodes') addCodes();
  else if (e.target.id === 'key') saveKey();
});

/* ---------- progressive web app ---------- */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); installEvt = e;
  if (!S.modal && S.view !== 'step') render();
});
window.addEventListener('appinstalled', () => { installEvt = null; if (!S.modal) render(); });
// Refresh the sample list when the app comes back to the screen or the network returns
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.view === 'home' && !S.modal && !S.busy && S.data) load(false);
});
window.addEventListener('online', () => { syncFails = 0; sync(); });
window.addEventListener('online', () => { if (S.view === 'home' && !S.busy && S.worker) load(false); });
// Pick up other phones' work every minute while the list is on screen
setInterval(() => {
  if (document.visibilityState === 'visible' && S.view === 'home' && !S.modal && !S.busy) load(false);
}, 60000);

// One-time setup link: #key=...  (saved on this phone, then removed from the address bar)
(function takeKeyFromLink() {
  const m = location.hash.match(/key=([^&]+)/);
  if (m) {
    KEY = decodeURIComponent(m[1]).trim(); store.set('ghkey', KEY);
    history.replaceState(null, '', location.pathname + location.search);
    setTimeout(() => toast('This phone is now connected.', true), 300);
  }
})();
S.tests = TESTS; S.order = ORDER;
S.file = readJSON('file', null);
if (S.file && S.file.codes) rebuild();
if (S.worker) { if (S.data) render(); else renderNotReady(); load(); sync(); } else render();
showSync();
</script>
</body>
</html>
